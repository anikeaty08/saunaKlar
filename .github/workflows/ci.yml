name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sauna
          POSTGRES_PASSWORD: sauna
          POSTGRES_DB: sauna
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sauna" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sauna:sauna@127.0.0.1:5432/sauna
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Database tests
        run: npm run test:db
      - name: API integration tests
        run: npm run test:api
      - name: Build
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Validate modules
        run: |
          for env in infra/envs/*/; do
            terraform -chdir="$env" init -backend=false -input=false
            terraform -chdir="$env" validate
          done
