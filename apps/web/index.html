<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f7" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=JetBrains+Mono:wght@300..600&display=swap"
    />
    <title>Saunas</title>
    <script>
      // The counter loader plays once per browser session; later loads get a plain, short splash.
      try { if (sessionStorage.getItem('sk.loader')) document.documentElement.classList.add('sk-seen'); sessionStorage.setItem('sk.loader', '1'); } catch (e) {}
    </script>
    <style>
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #f3f5f7; color: #0a1016; will-change: transform; border-radius: 0 0 28px 28px; }
      #splash .splash__mark { display: grid; gap: 18px; justify-items: center; }
      #splash svg { width: 56px; height: 56px; overflow: visible; }
      #splash path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: splash-draw 0.9s cubic-bezier(0.625, 0.05, 0, 1) forwards; }
      #splash path:nth-child(2) { animation-delay: 0.35s; }
      #splash path:nth-child(3) { animation-delay: 0.5s; }
      #splash path:nth-child(4) { animation-delay: 0.58s; }
      #splash path:nth-child(5) { animation-delay: 0.66s; }
      #splash .splash__count { font: 400 12px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.3em; font-variant-numeric: tabular-nums; opacity: 0.7; }
      #splash .splash__track { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; }
      #splash .splash__bar { display: block; height: 100%; background: currentColor; transform-origin: 0 50%; transform: scaleX(0); }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      .sk-seen #splash path { animation: none; stroke-dashoffset: 0; }
      .sk-seen #splash .splash__count, .sk-seen #splash .splash__track { display: none; }
      @media (prefers-color-scheme: dark) {
        #splash { background: #0b1117; color: #edf1f4; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash path { animation: none; stroke-dashoffset: 0; }
        #splash .splash__count, #splash .splash__track { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash__mark">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path pathLength="1" d="M9.5 3.25h13a6.25 6.25 0 0 1 6.25 6.25v13a6.25 6.25 0 0 1-6.25 6.25h-13A6.25 6.25 0 0 1 3.25 22.5v-13A6.25 6.25 0 0 1 9.5 3.25z" />
          <path pathLength="1" d="M9 23.25h14" />
          <path pathLength="1" d="M11.5 18.5c-1.6-1.7 1.6-3.3 0-5s1.6-3.3 0-5" />
          <path pathLength="1" d="M16 18.5c-1.6-1.7 1.6-3.3 0-5s1.6-3.3 0-5" />
          <path pathLength="1" d="M20.5 18.5c-1.6-1.7 1.6-3.3 0-5s1.6-3.3 0-5" />
        </svg>
        <span class="splash__count">000</span>
      </div>
      <span class="splash__track"><span class="splash__bar"></span></span>
    </div>
    <script>
      // Counter eases towards 90 while the app boots; hideSplash() finishes it to 100.
      (function () {
        var el = document.getElementById('splash'), c = el && el.querySelector('.splash__count'), bar = el && el.querySelector('.splash__bar');
        if (!c || document.documentElement.classList.contains('sk-seen') || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var t0 = performance.now();
        (function tick(now) {
          if (el.dataset.leaving) return;
          var v = 90 * (1 - Math.exp(-(now - t0) / 650));
          c.textContent = String(Math.floor(v)).padStart(3, '0');
          bar.style.transform = 'scaleX(' + v / 100 + ')';
          el.dataset.count = v;
          requestAnimationFrame(tick);
        })(t0);
      })();
    </script>
    <div id="root"></div>
    <noscript>This site needs JavaScript to show the sauna catalogue.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
